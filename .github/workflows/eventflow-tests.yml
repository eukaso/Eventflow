name: EventFlow tests

on:
  push:
    branches:
      - main
      - 'implementation/**'
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run automated test gate
        run: composer test

      - name: Build reproducible plugin artifact
        run: php tools/build-plugin-artifact.php --output=build/artifacts --verify-reproducible

      - name: Verify plugin artifact
        run: php tools/verify-plugin-artifact.php --directory=build/artifacts
