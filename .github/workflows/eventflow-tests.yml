name: EventFlow tests

on:
  push:
    branches:
      - main
      - 'implementation/**'
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run automated test gate
        shell: bash
        run: |
          set -o pipefail
          if ! composer test 2>&1 | tee /tmp/eventflow-test.log; then
            failure_tail="$(tail -n 60 /tmp/eventflow-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Automated test gate failed::${failure_tail}"
            exit 1
          fi

      - name: Build reproducible plugin artifact
        run: php tools/build-plugin-artifact.php --output=build/artifacts --verify-reproducible

      - name: Verify plugin artifact
        run: php tools/verify-plugin-artifact.php --directory=build/artifacts
